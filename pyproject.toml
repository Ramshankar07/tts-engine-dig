[project]
name = "tts-bench"
version = "0.1.0"
description = "P1: Qwen3-TTS engine comparison (official PyTorch vs vLLM-Omni vs SGLang-Omni), streaming tradeoffs and kernel profiling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Core deps are deliberately light: everything needed to run the benchmark
# harness against HTTP servers or the fake engine, compute WER from transcripts,
# simulate playback and build reports. No torch here.
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pandas>=2.1",
    "jiwer>=3.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
# In-process official Qwen3-TTS engine (+ torch.profiler). Install on the GPU box
# into its own venv; flash-attn is installed separately by scripts/setup_gpu_box.sh
# because it needs --no-build-isolation.
official = [
    "qwen-tts==0.1.1",
    "torch>=2.4",
    "nvidia-ml-py>=12.535",
]
# Quality evaluation: Whisper large-v3 ASR via transformers + UTMOSv2 predicted MOS.
# UTMOSv2 is not on PyPI; setup_gpu_box.sh installs it from git at a pinned SHA.
eval = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.30",
    "librosa>=0.10",
    "nvidia-ml-py>=12.535",
]

[project.scripts]
tts-bench = "tts_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_bench"]

[tool.uv]
# qwen-tts pins transformers==4.57.3; the eval stack may want a newer one.
# They live in separate venvs on the GPU box, so tell uv not to co-resolve them.
conflicts = [[{ extra = "official" }, { extra = "eval" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
